services:
  9router:
    depends_on:
      openai-oauth:
        condition: service_healthy

  openai-oauth:
    build:
      context: .
      dockerfile: Dockerfile.openai-oauth
    image: aestc-openai-oauth:2.0.0
    container_name: aestc-openai-oauth
    restart: unless-stopped
    expose:
      - "10531"
    volumes:
      - ${AESTC_OPENAI_OAUTH_CODEX_HOME:-/root/.codex}:/root/.codex
    read_only: true
    tmpfs:
      - /tmp
      - /root/.local
      - /root/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10531/v1/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
